<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频播放</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(960px, 94vw);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata">
      <source src="./video.mp4" type="video/mp4">
      当前浏览器不支持播放此视频。
    </video>
  </main>
</body>
</html>
